<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img"><title>사회조사 연구 과정</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1C5CFF"/></marker></defs><rect width="1000" height="390" fill="#fff"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" fill="#191F28"><text x="45" y="45" font-size="26" fill="#191F28" font-weight="700">설문과 인터뷰로 살펴본 AI 불안</text><text x="45" y="125" font-size="24" fill="#191F28" font-weight="700">문헌 검토</text><text x="45" y="162" font-size="18" fill="#191F28" font-weight="400">개념·측정 문항 설계</text><text x="350" y="125" font-size="24" fill="#191F28" font-weight="700">설문 분석</text><text x="350" y="162" font-size="18" fill="#191F28" font-weight="400">204건 → 202건</text><text x="680" y="125" font-size="24" fill="#191F28" font-weight="700">인터뷰</text><text x="680" y="162" font-size="18" fill="#191F28" font-weight="400">팀 6개 계열</text><path d="M245 135L320 135" stroke="#1C5CFF" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray=""/><path d="M575 135L650 135" stroke="#1C5CFF" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray=""/><text x="350" y="210" font-size="18" fill="#191F28" font-weight="400">Python 전처리·통계 분석</text><text x="350" y="242" font-size="18" fill="#191F28" font-weight="400">HC3 강건 표준오차</text><text x="350" y="274" font-size="18" fill="#191F28" font-weight="400">표본 불균형·민감도 검토</text><text x="680" y="210" font-size="18" fill="#191F28" font-weight="400">담당: 공학·사회과학·인문</text><text x="680" y="242" font-size="18" fill="#191F28" font-weight="400">응답의 맥락과 경험 해석</text><text x="45" y="355" font-size="20" fill="#1C5CFF" font-weight="700">문항 설계 → 정량 분석 → 질적 해석</text></g></svg>