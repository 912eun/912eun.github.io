<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">위치 오차와 각도 오차의 감소, 채점 AUC 증가를 직접 비교한 점 그래프</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#191F28"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#c5cbd2" stroke-width="2"/></pattern><radialGradient id="heat"><stop stop-color="#d8683b"/><stop offset=".4" stop-color="#e7aa76"/><stop offset="1" stop-color="#e9f1f6"/></radialGradient></defs><rect width="1000" height="520" fill="white"/><g font-family="Noto Sans KR, Arial, sans-serif"><text x="30" y="35" font-size="24" fill="#191F28" text-anchor="start" font-weight="600">보충 정확도와 실제 채점 변별력</text><text x="30" y="105" font-size="18" fill="#191F28" text-anchor="start" font-weight="600">3D 위치 오차</text><path d="M380,120 L920,120" fill="none" stroke="#e5e8eb" stroke-width="2" /><path d="M822.8,120 L641.9,120" fill="none" stroke="#1C5CFF" stroke-width="2" /><circle cx="822.8" cy="120" r="6" fill="#667085"/><text x="822.8" y="100" font-size="16" fill="#667085" text-anchor="middle" font-weight="400">비교 기준 164mm</text><circle cx="641.9" cy="120" r="6" fill="#1C5CFF"/><text x="641.9" y="154" font-size="16" fill="#1C5CFF" text-anchor="middle" font-weight="400">보충 적용 97mm</text><text x="380" y="182" font-size="13" fill="#667085" text-anchor="middle" font-weight="400">0</text><text x="920" y="182" font-size="13" fill="#667085" text-anchor="middle" font-weight="400">200</text><text x="30" y="235" font-size="18" fill="#191F28" text-anchor="start" font-weight="600">관절 각도 오차</text><path d="M380,250 L920,250" fill="none" stroke="#e5e8eb" stroke-width="2" /><path d="M776.0,250 L639.2,250" fill="none" stroke="#1C5CFF" stroke-width="2" /><circle cx="776.0" cy="250" r="6" fill="#667085"/><text x="776.0" y="230" font-size="16" fill="#667085" text-anchor="middle" font-weight="400">비교 기준 22°</text><circle cx="639.2" cy="250" r="6" fill="#1C5CFF"/><text x="639.2" y="284" font-size="16" fill="#1C5CFF" text-anchor="middle" font-weight="400">보충 적용 14.4°</text><text x="380" y="312" font-size="13" fill="#667085" text-anchor="middle" font-weight="400">0</text><text x="920" y="312" font-size="13" fill="#667085" text-anchor="middle" font-weight="400">30</text><text x="30" y="365" font-size="18" fill="#191F28" text-anchor="start" font-weight="600">채점 구분 AUC</text><path d="M380,380 L920,380" fill="none" stroke="#e5e8eb" stroke-width="2" /><path d="M598.16,380 L650.0,380" fill="none" stroke="#1C5CFF" stroke-width="2" /><circle cx="598.16" cy="380" r="6" fill="#667085"/><text x="598.16" y="360" font-size="16" fill="#667085" text-anchor="middle" font-weight="400">비교 기준 0.702</text><circle cx="650.0" cy="380" r="6" fill="#1C5CFF"/><text x="650.0" y="414" font-size="16" fill="#1C5CFF" text-anchor="middle" font-weight="400">보충 적용 0.75</text><text x="380" y="442" font-size="13" fill="#667085" text-anchor="middle" font-weight="400">0.5</text><text x="920" y="442" font-size="13" fill="#667085" text-anchor="middle" font-weight="400">1</text><text x="30" y="505" font-size="11" fill="#B0B8C1" text-anchor="start" font-weight="400">위치·각도: RTMW3D-L 미세조정 대비 · AUC: MediaPipe 단독 대비</text></g></svg>