<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><title>AI 불안 연구 결과와 해석 범위</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1C5CFF"/></marker></defs><rect width="1000" height="410" fill="#fff"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" fill="#191F28"><text x="45" y="45" font-size="25" fill="#191F28" font-weight="700">학습 불안과 취업 불안 사이의 연관성</text><circle cx="190" cy="190" r="76" fill="#EBF1FF" stroke="#1C5CFF"/><text x="145" y="197" font-size="18" fill="#191F28" font-weight="400">학습 불안</text><circle cx="780" cy="190" r="76" fill="#EBF1FF" stroke="#1C5CFF"/><text x="735" y="197" font-size="18" fill="#191F28" font-weight="400">취업 불안</text><path d="M270 190H700" stroke="#1C5CFF" stroke-width="3"/><text x="375" y="164" font-size="21" fill="#1C5CFF" font-weight="700">연관성 관측</text><text x="380" y="280" font-size="21" fill="#191F28" font-weight="700">AI 리터러시</text><path d="M465 250L465 205" stroke="#1C5CFF" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="290" y="320" font-size="18" fill="#191F28" font-weight="400">조절효과는 통계적으로 유의하지 않음</text><text x="45" y="370" font-size="17" fill="#4E5968" font-weight="400">횡단면·비확률 표본: 인과관계 또는 효과 부재를 확정하지 않음</text></g></svg>